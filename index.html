<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Accounts map</title>
<style>:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2330;--mut:#6b7080;--line:#e6e8ee;--acc:#3457d5;--head:#f1f3f8;--ok:#178a4c;--bad:#d0453b;--warn:#a86a00}
@media (prefers-color-scheme:dark){:root{--bg:#121318;--card:#1b1c23;--ink:#e7e8ec;--mut:#9a9eab;--line:#2a2c35;--acc:#8ea2ff;--head:#20222b;--ok:#4fd18b;--bad:#ff7a70;--warn:#f0b44c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:1600px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}.k:hover{border-color:var(--acc)}.k b{display:block;font-size:22px}.k span{color:var(--mut);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}#q{flex:1;min-width:200px}button.csv{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.t{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:78vh}table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}th{background:var(--head);position:sticky;top:0;cursor:pointer;white-space:nowrap;font-weight:600;z-index:1}
tr:nth-child(even) td{background:color-mix(in srgb,var(--head) 45%,transparent)}td.rn{color:var(--mut);text-align:right;width:1%}
td.u{min-width:240px;max-width:420px;word-break:break-all}td.u a{display:block;color:var(--acc);text-decoration:none}td.u a:hover{text-decoration:underline}td.l{min-width:160px;max-width:300px}td.x{max-width:320px}
.s-ok{color:var(--ok);font-weight:600}.s-bad{color:var(--bad);font-weight:600}.s-warn{color:var(--warn);font-weight:600}.cnt{color:var(--mut);font-size:12px}
#gate{min-height:100vh;display:grid;place-items:center;padding:16px}.lg{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 10px 30px #0000000f}
.lg h2{margin:0 0 4px;font-size:20px}.lg p{margin:0 0 16px;color:var(--mut)}.lg label{display:block;font-size:13px;color:var(--mut);margin-bottom:12px}.lg input{display:block;width:100%;margin-top:4px;padding:10px}
.lg button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}.lg button:disabled{opacity:.6}.lm{min-height:18px;margin-top:10px;color:var(--bad);font-size:13px}[hidden]{display:none!important}</style></head>
<body><div id="gate"><form id="lf" class="lg"><h2>Accounts map</h2><p>Sign in to view</p>
<label>Username<input id="lu" autocomplete="username" required></label><label>Password<input id="lp" type="password" autocomplete="current-password" required></label>
<button id="lb" type="submit">Sign in</button><div id="lm" class="lm"></div></form></div>
<div class="w" id="app" hidden><h1>Accounts map</h1><p class="sub" id="sub"></p><div class="kpis" id="kpis"></div>
<div class="bar" id="tabs"></div>
<div class="bar"><input id="q" placeholder="Search everything… (domain, email, project, 404, do not touch)"><select id="ty"><option value="">All types</option></select><button class="csv" id="csv">Download CSV (Excel)</button><span class="cnt" id="cnt"></span></div>
<div class="t"><table id="tb"></table></div>

async function unlock(u,p){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(u+":"+p),"PBKDF2",false,["deriveKey"]);

function all(){return T==="all"?P.order.flatMap(k=>P.secs[k].map(r=>({...r,_s:k}))):P.secs[T].map(r=>({...r,_s:T}))}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function stc(s){s=s.toLowerCase();if(/404|dark|lost|dead|expired|wiped|flagged|down|error|refused/.test(s))return"s-bad";if(/live|200|ok|active|running|verified/.test(s))return"s-ok";if(/empty|spare|unknown|paused|pending/.test(s))return"s-warn";return""}
function start(){$("gate").remove();$("app").hidden=false;const tot=P.order.reduce((a,k)=>a+P.counts[k],0);
$("sub").textContent="Every account, resource, URL and login we hold · "+tot+" rows · last updated "+P.now+" · click a column to sort";

const pick=k=>{T=k;S=null;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.k===k));types();draw()};
document.querySelectorAll(".tab,.k").forEach(b=>b.onclick=()=>pick(b.dataset.k));$("q").oninput=draw;$("ty").onchange=draw;types();draw()}
function types(){const s=[...new Set(all().map(r=>r.type).filter(Boolean))].sort();$("ty").innerHTML='<option value="">All types</option>'+s.map(t=>`<option>${esc(t)}</option>`).join("")}
function cols(){return T==="all"?["provider","account","type","name","urls","used_for","status","login","vault","notes"]:P.cols}
function rows(){let r=all();const f=$("q").value.toLowerCase().trim(),ty=$("ty").value;if(ty)r=r.filter(x=>x.type===ty);
