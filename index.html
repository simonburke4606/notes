<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Notes</title>
<style>:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2330;--mut:#6b7080;--line:#e6e8ee;--acc:#3457d5;--head:#f1f3f8;--ok:#178a4c;--bad:#d0453b;--warn:#a86a00}
@media (prefers-color-scheme:dark){:root{--bg:#121318;--card:#1b1c23;--ink:#e7e8ec;--mut:#9a9eab;--line:#2a2c35;--acc:#8ea2ff;--head:#20222b;--ok:#4fd18b;--bad:#ff7a70;--warn:#f0b44c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:1500px;margin:0 auto;padding:16px}h1{font-size:24px;margin:4px 0 2px}.sub{color:var(--mut);margin:0 0 14px}
.help{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;color:var(--mut);font-size:14px}.help b{color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit}.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}.tab small{opacity:.7;margin-left:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}#q{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
button.b2{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}.cnt{color:var(--mut);font-size:13px}
.t{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:76vh}table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top;text-align:left}th{background:var(--head);position:sticky;top:0;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px;color:var(--mut);z-index:1}
td.nm{font-weight:600;min-width:180px}td.wh{color:var(--mut);white-space:nowrap;font-size:13px}td.lk{min-width:200px;max-width:340px;word-break:break-all;font-size:13px}td.lk a{display:block;color:var(--acc);text-decoration:none}td.lk a:hover{text-decoration:underline}
td.us{font-size:13px;min-width:160px;max-width:260px;word-break:break-word}td.no{font-size:13px;max-width:360px}td.uf{font-size:13px;max-width:240px}
.pw{display:inline-flex;gap:6px;align-items:center}.pw code{font:13px ui-monospace,Menlo,monospace;background:var(--head);padding:3px 7px;border-radius:6px;cursor:pointer;user-select:all;word-break:break-all}.pw button{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:6px;padding:2px 7px;cursor:pointer;font-size:12px}
.none{color:var(--mut);font-size:13px}
.st{font-weight:600;font-size:13px;white-space:nowrap}.st-ok{color:var(--ok)}.st-bad{color:var(--bad)}.st-warn{color:var(--warn)}.st-mut{color:var(--mut)}
#gate{min-height:100vh;display:grid;place-items:center;padding:16px}.lg{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 10px 30px #0000000f}
.lg h2{margin:0 0 4px;font-size:20px}.lg p{margin:0 0 16px;color:var(--mut)}.lg label{display:block;font-size:13px;color:var(--mut);margin-bottom:12px}.lg input{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.lg button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}.lg button:disabled{opacity:.6}.lm{min-height:18px;margin-top:10px;color:var(--bad);font-size:13px}[hidden]{display:none!important}
@media (max-width:700px){th:nth-child(n+6),td:nth-child(n+6){display:none}}</style></head>

<button id="lb" type="submit">Sign in</button><div id="lm" class="lm"></div></form></div>
<div class="w" id="app" hidden><h1>Our accounts, websites and logins</h1><p class="sub" id="sub"></p>

async function unlock(u,p){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(u+":"+p),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(E.s),iterations:E.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);

const TABS=[["logins","Logins & passwords"],["sites","Websites & domains"],["cloudflare","Cloudflare"],["github","GitHub"],["hosting","Servers"],["accounts","Google · networks · tools"],["projects","Projects"],["all","Everything"]];
let ALL=[];
function start(){$("gate").remove();$("app").hidden=false;
ALL=P.order.flatMap(k=>P.secs[k].map(r=>({...r,_s:k})));
$("sub").textContent=ALL.length+" items · updated "+P.now;
$("foot").textContent="Updated automatically by our build script. Nothing here is visible without signing in.";
$("tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab${k===T?" on":""}" data-k="${k}">${l}<small>${pick(k).length}</small></button>`).join("");
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{T=b.dataset.k;S=null;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));draw()});
$("q").oninput=draw;draw()}
function pick(k){if(k==="all")return ALL;if(k==="logins")return ALL.filter(r=>r.is_login);
if(k==="sites")return ALL.filter(r=>/^(zone|domain|pages|pages-site|vhost)$/.test(r.type));return ALL.filter(r=>r._s===k)}
const COLS=[["what","What"],["name","Name"],["urls","Link"],["account","Username / account"],["password","Password"],["status","Status"],["used_for","Used for"],["notes","Notes"]];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function stc(s){s=String(s).toLowerCase();if(/working|live/.test(s))return"st-ok";if(/down|not found|gone|404|dead/.test(s))return"st-bad";if(/empty|unknown|spare|login needed/.test(s))return"st-warn";if(/do not touch/.test(s))return"st-bad";return"st-mut"}
function rows(){let r=pick(T);const f=$("q").value.toLowerCase().trim();if(f){const w=f.split(/\s+/);r=r.filter(x=>{const s=[x.what,x.name,x.urls,x.account,x.status,x.used_for,x.notes,x.provider].join(" ").toLowerCase();return w.every(t=>s.includes(t))})}
if(!S&&T==="logins")r=[...r].sort((a,b)=>(b.password?1:0)-(a.password?1:0));if(S)r=[...r].sort((a,b)=>String(a[S]).localeCompare(String(b[S]),undefined,{numeric:true})*dir);return r}
function links(v){const u=String(v).split(/\s+/).filter(Boolean).filter(x=>!/dash\.cloudflare\.com\/[0-9a-f]{32}\/.+/.test(x)||true).slice(0,6);
return u.map(x=>{const h=/^https?:\/\//.test(x)?x:(/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(x)?"https://"+x:"");const lab=/dash\.cloudflare\.com/.test(x)?"Cloudflare dashboard ↗":/cloud\.digitalocean\.com/.test(x)?"DigitalOcean dashboard ↗":/search\.google\.com\/search-console/.test(x)?"Search Console ↗":x.replace(/^https?:\/\//,"").replace(/\/$/,"");return h?`<a href="${esc(h)}" target="_blank" rel="noopener noreferrer">${esc(lab)}</a>`:`<span>${esc(x)}</span>`}).join("")||'<span class="none">—</span>'}
function pw(r,i){if(!r.is_login)return '<span class="none">—</span>';if(!r.password)return '<span class="none">not saved</span>';
return `<span class="pw"><code data-i="${i}" title="Click to copy">•••••</code><button data-i="${i}">Show</button></span>`}
let CUR=[];
function draw(){CUR=rows();let h="<thead><tr>"+COLS.map(([c,l])=>`<th data-c="${c}">${l}${S===c?(dir>0?" ▲":" ▼"):""}</th>`).join("")+"</tr></thead><tbody>";
CUR.forEach((r,i)=>{h+=`<tr><td class="wh">${esc(r.what||"")}</td><td class="nm">${esc(r.name)}</td><td class="lk">${links(r.urls)}</td><td class="us">${esc(r.account)||'<span class="none">—</span>'}</td><td>${pw(r,i)}</td><td class="st ${stc(r.status)}">${esc(r.status||"")}</td><td class="uf">${esc(r.used_for||"")}</td><td class="no">${esc(r.notes||"")}</td></tr>`});
$("tb").innerHTML=h+"</tbody>";$("cnt").textContent=CUR.length+" shown";
$("tb").querySelectorAll("th").forEach(th=>th.onclick=()=>{const c=th.dataset.c;dir=S===c?-dir:1;S=c;draw()});
$("tb").querySelectorAll(".pw button").forEach(b=>b.onclick=()=>{const c=b.previousElementSibling,r=CUR[+b.dataset.i];const open=c.textContent!=="•••••";c.textContent=open?"•••••":r.password;b.textContent=open?"Show":"Hide"});
$("tb").querySelectorAll(".pw code").forEach(c=>c.onclick=async()=>{const r=CUR[+c.dataset.i];try{await navigator.clipboard.writeText(r.password);const b=c.nextElementSibling,o=b.textContent;b.textContent="Copied";setTimeout(()=>b.textContent=o,1200)}catch(_){c.textContent=r.password}})}
$("csv").onclick=()=>{const r=[COLS.filter(c=>c[0]!=="password").map(c=>c[1]),...rows().map(x=>COLS.filter(c=>c[0]!=="password").map(c=>x[c[0]]||""))];const s="﻿"+r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));a.download="notes-"+T+".csv";a.click()};
